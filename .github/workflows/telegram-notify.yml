name: Telegram notifications

# Forwards Uno, Duo and Quan's GitHub activity to Telegram: their issue/PR
# comments, QA reviews, opened PRs, merges and failed CI/deploy runs.
# Needs repository secrets TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID.
on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, closed]
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: ["CI", "Deploy web app to GitHub Pages"]
    types: [completed]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node .github/scripts/telegram-notify.mjs
